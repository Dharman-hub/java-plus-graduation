services:

  analyzer-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"

  kafka:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://localhost:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1

  user-db:
    image: postgres:16.1
    container_name: postgres-ewm-user-db
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
      - POSTGRES_DB=ewm-user
    volumes:
      - user-db-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ewm-user"]
      timeout: 5s
      interval: 5s
      retries: 10
    restart: on-failure

  event-db:
    image: postgres:16.1
    container_name: postgres-ewm-event-db
    ports:
      - "6543:5432"
    environment:
      - POSTGRES_USER=event
      - POSTGRES_PASSWORD=event
      - POSTGRES_DB=ewm-event
    volumes:
      - event-db-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event -d ewm-event"]
      timeout: 5s
      interval: 5s
      retries: 10
    restart: on-failure

  request-db:
    image: postgres:16.1
    container_name: postgres-ewm-request-db
    ports:
      - "6544:5432"
    environment:
      - POSTGRES_USER=request
      - POSTGRES_PASSWORD=request
      - POSTGRES_DB=ewm-request
    volumes:
      - request-db-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U request -d ewm-request"]
      timeout: 5s
      interval: 5s
      retries: 10
    restart: on-failure

  review-db:
    image: postgres:16.1
    container_name: postgres-ewm-review-db
    ports:
      - "6545:5432"
    environment:
      - POSTGRES_USER=review
      - POSTGRES_PASSWORD=review
      - POSTGRES_DB=ewm-review
    volumes:
      - review-db-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d ewm-review"]
      timeout: 5s
      interval: 5s
      retries: 10
    restart: on-failure

volumes:
  user-db-data:
  event-db-data:
  request-db-data:
  review-db-data: