server.port=8080

spring.cloud.gateway.routes[0].id=request-service
spring.cloud.gateway.routes[0].uri=lb://request-service
spring.cloud.gateway.routes[0].order=-30
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/*/requests/**,/users/*/events/*/requests/**

spring.cloud.gateway.routes[1].id=review-service
spring.cloud.gateway.routes[1].uri=lb://review-service
spring.cloud.gateway.routes[1].order=-20
spring.cloud.gateway.routes[1].predicates[0]=Path=/admin/comments/**,/events/*/comments/**,/users/*/events/*/comments/**

spring.cloud.gateway.routes[2].id=user-service
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].order=-10
spring.cloud.gateway.routes[2].predicates[0]=Path=/admin/users/**

spring.cloud.gateway.routes[3].id=event-service
spring.cloud.gateway.routes[3].uri=lb://event-service
spring.cloud.gateway.routes[3].order=0
spring.cloud.gateway.routes[3].predicates[0]=Path=/events/**,/users/*/events/**,/admin/events/**,/categories/**,/admin/categories/**,/compilations/**,/admin/compilations/**

spring.cloud.gateway.routes[4].id=stats-server
spring.cloud.gateway.routes[4].uri=lb://stats-server
spring.cloud.gateway.routes[4].order=10
spring.cloud.gateway.routes[4].predicates[0]=Path=/hit,/stats/**